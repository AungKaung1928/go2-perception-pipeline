name: build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    container: ros:humble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/perception_pipeline
      - name: Install dependencies
        run: |
          apt-get update
          rosdep update
          rosdep install --from-paths src --ignore-src -y
      - name: Build
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --packages-select perception_pipeline --event-handlers console_direct+
      - name: Package installed
        run: |
          source install/setup.bash
          ros2 pkg prefix perception_pipeline
      - name: Launch test (filter node as its own process)
        run: |
          source install/setup.bash
          cd src/perception_pipeline
          FILTER_CSV=$GITHUB_WORKSPACE/filter.csv launch_test test/test_launch_filter.py
          python3 scripts/plot_filter.py $GITHUB_WORKSPACE/filter.csv $GITHUB_WORKSPACE/filter.svg
      - name: Upload the filter result
        uses: actions/upload-artifact@v4
        with:
          name: filter
          path: |
            filter.csv
            filter.svg
